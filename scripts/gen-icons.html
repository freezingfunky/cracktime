<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<script>
// Generate simple shield icons at 16, 48, 128px
[16, 48, 128].forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0f0f17';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.15);
  ctx.fill();

  // Shield
  const cx = size / 2;
  const cy = size / 2;
  const s = size * 0.35;

  ctx.fillStyle = '#6c63ff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - s);
  ctx.lineTo(cx + s * 0.8, cy - s * 0.5);
  ctx.lineTo(cx + s * 0.8, cy + s * 0.2);
  ctx.quadraticCurveTo(cx, cy + s, cx, cy + s);
  ctx.quadraticCurveTo(cx, cy + s, cx - s * 0.8, cy + s * 0.2);
  ctx.lineTo(cx - s * 0.8, cy - s * 0.5);
  ctx.closePath();
  ctx.fill();

  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL();
  link.click();
});
</script>
<p>Icons downloaded!</p>
</body>
</html>
